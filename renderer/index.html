<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cap or Fact</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <h1>Cap or Fact</h1>
      <p id="pipe" data-state="loading">Pipe: waiting</p>
      <p id="vault" data-state="loading">Opening vault...</p>
      <p id="notice" data-state="error" hidden></p>
      <section id="home">
        <button id="create" type="button" disabled>Create</button>
        <form id="join-form">
          <input
            id="invite-input"
            type="text"
            placeholder="Paste invite"
            autocomplete="off"
            disabled
          />
          <button id="join" type="submit" disabled>Join</button>
        </form>
      </section>
      <section id="lobby" hidden>
        <div id="invite-box">
          <textarea id="invite" readonly rows="3">Creating invite...</textarea>
          <button id="copy" type="button">Copy</button>
        </div>
        <form id="name-form">
          <input
            id="name-input"
            type="text"
            placeholder="Your name"
            autocomplete="off"
            maxlength="24"
          />
          <button id="save-name" type="submit">Save name</button>
        </form>
        <p id="name-status" hidden></p>
        <ul id="players"></ul>
        <button id="start" type="button" hidden disabled>Start</button>
      </section>
      <section id="turn" hidden>
        <p id="turn-title"></p>
        <ul id="queue"></ul>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
